# Override de produção pra Lightsail micro_3_0 (1 GB RAM).
# Aplicado com:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Tuning ajustado pra caber em 1 GB + 4 GB swap.

services:
  postgres:
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=256MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c max_connections=20
      -c log_min_duration_statement=2000
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 200M

  redis:
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 150M

  engine:
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 500M  # Playwright/Chromium consome ~400M quando ativo

  worker:
    environment:
      NODE_ENV: production
      WORKER_CONCURRENCY: "1"
      JOB_ATTEMPTS: "3"
    deploy:
      resources:
        limits:
          memory: 250M

  scheduler:
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 100M

  panel:
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 200M
    ports: !override
      - "127.0.0.1:3001:3000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # RDS do ERP (somente leitura). Vazio = /status responde erp: null.
      ERP_DATABASE_URL: ${ERP_DATABASE_URL:-}
      AUTH_SECRET: ${AUTH_SECRET}
      PANEL_URL: http://panel:3000
      PANEL_USER: ${PANEL_USER}
      PANEL_PASSWORD: ${PANEL_PASSWORD}
      PANEL_API_TOKEN: ${PANEL_API_TOKEN}
      PORT: "3000"
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://app.horushawks.com}
    depends_on:
      postgres:
        condition: service_healthy
      panel:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 250M

  # Pipeline de imagens (job pontual, NÃO sobe no `up` — profile "pipeline").
  # Rodar detached:  docker compose --profile pipeline run -d --rm imgpipe
  imgpipe:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    profiles: ["pipeline"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 400M
