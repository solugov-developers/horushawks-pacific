# Override de produção pra Lightsail micro_3_0 (1 GB RAM).
# Aplicado com:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Tuning ajustado pra caber em 1 GB + 4 GB swap.

services:
  postgres:
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=256MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c max_connections=20
      -c log_min_duration_statement=2000
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 200M

  redis:
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 150M

  engine:
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 500M  # Playwright/Chromium consome ~400M quando ativo

  worker:
    environment:
      NODE_ENV: production
      WORKER_CONCURRENCY: "1"
      JOB_ATTEMPTS: "3"
    deploy:
      resources:
        limits:
          memory: 250M

  scheduler:
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 100M

  panel:
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 200M
    ports: !override
      - "127.0.0.1:3001:3000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      PANEL_URL: http://panel:3000
      PANEL_USER: ${PANEL_USER}
      PANEL_PASSWORD: ${PANEL_PASSWORD}
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      panel:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 250M
